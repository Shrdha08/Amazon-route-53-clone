# Render blueprint for the API. The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: route53-clone-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      # Free instances have an ephemeral disk: data resets on redeploy and is re-seeded on boot.
      # To keep data, upgrade the plan, attach a disk mounted at /app/data and keep this DATABASE_URL.
      - key: DATABASE_URL
        value: sqlite:////app/data/route53.db
